# rust-engine/Cargo.toml
[package]
name = "rust-nesting"
version = "0.1.0"
edition = "2021"
description = "Motor de geometria computacional True-Shape para Nesting DXF"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1